services:
  sentinel:
    build: .
    ports:
      - "8000:8000"
    # Optional local overrides (copy .env.example to .env to customize).
    # Compose must also validate on machines without a .env file.
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8000"
      SENTINEL_DATABASE_PATH: /app/data/sentinel.db
      SENTINEL_DEMO_MODE: "true"
    volumes:
      - sentinel-data:/app/data
    restart: unless-stopped

volumes:
  sentinel-data:
